name: Contrôle SEO & performance

# Garde-fou gratuit : PageSpeed Insights (Lighthouse : performance, SEO,
# accessibilité, bonnes pratiques) sur les pages clés, plus l'audit maison
# (titres, descriptions, canonical, hreflang, liens morts).
#
# L'API PageSpeed Insights accepte une clé (secret PAGESPEED_API_KEY). Sans
# clé, le quota public est partagé et tombe vite à 429 : le rapport est alors
# ignoré, sans faire échouer le contrôle.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit du site déployé (titres, liens, hreflang)
        env:
          ORIGIN: https://psychomotricite-nantes.vercel.app
        run: |
          node scripts/audit-site.mjs "$ORIGIN" || echo "::warning::l'audit a relevé des erreurs"

      - name: PageSpeed Insights (mobile)
        env:
          ORIGIN: https://psychomotricite-nantes.vercel.app
          PSI_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: |
          for path in "/" "/contact" "/psychomotricite" "/seances-et-tarifs"; do
            url="${ORIGIN}${path}"
            if [ -n "$PSI_KEY" ]; then
              api="https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=${url}&key=${PSI_KEY}"
            else
              api="https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=${url}"
            fi
            echo "::group::${url}"
            curl -sS "$api" | jq -r '
              if .lighthouseResult then
                (.lighthouseResult.categories | to_entries[] | "\(.key): \((.value.score * 100) | round)/100"),
                "LCP: \(.lighthouseResult.audits["largest-contentful-paint"].displayValue)",
                "CLS: \(.lighthouseResult.audits["cumulative-layout-shift"].displayValue)",
                "TBT: \(.lighthouseResult.audits["total-blocking-time"].displayValue)"
              else
                "réponse: \(.error.message // "inconnue")"
              end'
            echo "::endgroup::"
          done
